<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Modern Architectural Emblem: House + Tech Brackets -->
  <g transform="translate(10, 8)">
    <!-- Base House Shield in Solid Crimson Red -->
    <path d="M36 2 L70 28 L70 62 C70 66 66 70 62 70 L10 70 C6 70 2 66 2 62 L2 28 Z" fill="url(#cleanRedGrad)" />
    
    <!-- Clean Roof Line -->
    <path d="M36 0 L74 29 L68 33 L36 8 L4 33 L0 29 Z" fill="#991B1B" />
    
    <!-- Clean White Code Brackets -->
    <path d="M24 33 L16 41 L24 49" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M48 33 L56 41 L48 49" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Clean Pin Core -->
    <circle cx="36" cy="38" r="5" fill="#FFFFFF" />
    <path d="M36 43 L36 53" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography: Deep Ink Slate + Crimson Red -->
  <g transform="translate(98, 16)">
    <!-- "UK" Badge in Solid Red -->
    <rect x="0" y="4" width="44" height="30" rx="6" fill="url(#cleanRedGrad)" />
    <text x="22" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0.5">UK</text>
    
    <!-- "RentServe" Text -->
    <text x="56" y="28" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Rent<tspan fill="#B91C1C">Serve</tspan></text>
    
    <!-- Kannada Subtitle & Tagline -->
    <text x="0" y="52" fill="#475569" font-family="'Noto Sans Kannada', 'Inter', sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">ನಮ್ಮ ಉತ್ತರ ಕರ್ನಾಟಕ <tspan fill="#B91C1C" font-weight="900">•</tspan> <tspan fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">BUILD SKILLS &amp; LOCAL SERVICES</tspan></text>
  </g>
</svg>
